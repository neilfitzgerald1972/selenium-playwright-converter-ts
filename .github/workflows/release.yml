name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run type check
        run: npm run type-check
      
      - name: Run tests
        run: npm run test:ci
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  package-test:
    name: Test Package Installation
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Test Package Installation (Unix)
        if: runner.os != 'Windows'
        run: |
          npm pack
          npm i -g *.tgz
          sel2pw --version
          sel2pw --help
          selenium-to-playwright --help
          
          # Test conversion
          echo "const { Builder, By } = require('selenium-webdriver'); async function test() { const driver = await new Builder().forBrowser('chrome').build(); }" > test.js
          sel2pw test.js --dry-run
          
          npm uninstall -g selenium-playwright-converter-ts
      
      - name: Test Package Installation (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          npm pack
          $package = Get-ChildItem -Filter "*.tgz" | Select-Object -First 1
          npm i -g $package.Name
          sel2pw --version
          sel2pw --help
          selenium-to-playwright --help
          
          # Test conversion
          @"
          const { Builder, By } = require('selenium-webdriver');
          async function test() {
            const driver = await new Builder().forBrowser('chrome').build();
          }
          "@ | Out-File -FilePath test.js -Encoding UTF8
          
          sel2pw test.js --dry-run
          
          npm uninstall -g selenium-playwright-converter-ts

  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs: [test, package-test]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version
      
      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version
      
      - name: Final Package Test
        run: bash scripts/test-package.sh
      
      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            selenium-playwright-converter-ts-*.tgz

  verify-release:
    name: Verify NPM Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Wait for NPM propagation
        run: sleep 60
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Verify package installation from NPM
        run: |
          npm install -g selenium-playwright-converter-ts@latest
          sel2pw --version
          sel2pw --help
          
          # Test basic conversion
          echo "const { Builder } = require('selenium-webdriver');" > test.js
          sel2pw test.js --dry-run
          
          npm uninstall -g selenium-playwright-converter-ts
      
      - name: Notify on success
        run: echo "✅ Package successfully published and verified on NPM!"